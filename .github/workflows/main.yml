on: [push]
name: Build
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and deploy RPM
    steps:
      - uses: actions/checkout@v3
        with:
          path: matreshka
      - uses: reznikmm/fedora-ada-action@v36
        with:
          spec: matreshka/packages/copr/matreshka.spec
